<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeZone Project</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.37/moment-timezone-with-data-1970-2030.min.js"></script>

    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>TimeZones⌛</h1>
        </header>

        <form>
            <select id="cities">
                <option value="">Select a city</option>
                <option value="Europe/Paris">Paris 🇫🇷</option>
                <option value="Europe/London">London 🇬🇧</option>
                <option value="Africa/Johannesburg">Johannesburg 🇿🇦</option>
            </select>
        </form>

        <main>
            <div id="current-date" class="time-output"></div>
        </main>

        <footer>
            © 2026. This project was coded by Mel.
        </footer>
    </div>

    <script src="src/script.js"></script>
</body>
</html>
